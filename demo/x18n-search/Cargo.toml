[package]
name = "fuzzy-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `packages/core/src/fuzzy.ts`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
rayon = "1"
mimalloc = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
