[package]
name = "contracts-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `packages/core/src/contracts.ts`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
