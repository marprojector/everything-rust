[package]
name = "colorsys-pkg-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/colorsys_pkg/`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
