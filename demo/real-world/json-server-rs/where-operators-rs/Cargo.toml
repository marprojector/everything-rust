[package]
name = "where-operators-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/where-operators.ts`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
json-server-js = { path = "../json-server-js" }
napi = "3"
napi-derive = "3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
