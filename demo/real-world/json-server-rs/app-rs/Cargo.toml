[package]
name = "app-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/rust/app-requests.ts`, generated by everything-rust"

[dependencies]
json-server-js = { path = "../json-server-js" }
parse-where-rs = { path = "../parse-where-rs" }
service-rs = { path = "../service-rs" }
sha1_smol = { version = "1", features = ["std"] }
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
