[package]
name = "service-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/rust/service-calls.ts`, generated by everything-rust"

[dependencies]
getrandom = "0.3"
json-server-js = { path = "../json-server-js" }
matches-where-rs = { path = "../matches-where-rs" }
paginate-rs = { path = "../paginate-rs" }
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
