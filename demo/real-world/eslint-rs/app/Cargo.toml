[package]
name = "eslint"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `eslint`, generated by everything-rust: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "eslint"
path = "src/main.rs"

[dependencies]
clap = "4"
eslint-linter-rs = { path = "../linter-rs" }

[workspace]

[profile.release]
lto = true
