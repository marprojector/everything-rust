[package]
name = "shellwords-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `lib/shellwords.rb`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
magnus = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rayon = "1"
mimalloc = "0.1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
