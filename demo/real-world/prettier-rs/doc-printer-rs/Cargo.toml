[package]
name = "doc-printer-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/document/`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
