[package]
name = "prettier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `prettier`, generated by everything-rust: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "prettier"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = "1"
regex = "1"
ignore = "0.4"
js-format-rs = { path = "../js-format-rs" }

[workspace]
