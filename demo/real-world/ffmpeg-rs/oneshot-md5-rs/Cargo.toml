[package]
name = "oneshot-md5-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "LGPL-2.1-or-later"
description = "Rust port of `oneshot_md5.c`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `everything_rust_` names, to link beside the original C code.
shadow = []

[dependencies]

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
