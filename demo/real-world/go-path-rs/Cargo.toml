[package]
name = "path-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `path/`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
