[package]
name = "relevance-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/rust/relevance.ts`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rayon = "1"
mimalloc = "0.1"
unicode-normalization = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
