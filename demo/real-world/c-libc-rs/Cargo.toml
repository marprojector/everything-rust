[package]
name = "facade-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/facade.c`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `everything_rust_` names, to link beside the original C code.
shadow = []

[dependencies]

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
