[package]
name = "fuzzy-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `packages/core/src/fuzzy.ts`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
