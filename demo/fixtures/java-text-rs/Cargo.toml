[package]
name = "text-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/main/java/com/example/text/`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jni = "0.21"
rayon = "1"
mimalloc = "0.1"
unicode-general-category = "1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
