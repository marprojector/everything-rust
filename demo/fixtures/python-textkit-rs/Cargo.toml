[package]
name = "textkit-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/textkit/`, generated by everything-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unicode-normalization = "0.1"
unicode-general-category = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
mimalloc = "0.1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
