name: Bug report
description: Something everything-rust did wrong, or a port it got wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem goes through the private report in SECURITY.md instead.

        **Don't paste secrets or private data.** Leave out API keys, tokens, private code, and the
        recorded `cases.jsonl` (or `rust/app-cases/`) of a private project: recordings contain real
        inputs and outputs. A minimal repro with made-up data is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands, and a minimal project if you can (a few files is ideal).
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full error or the relevant part of the output.
      render: text
  - type: input
    id: version
    attributes:
      label: everything-rust version
      description: Output of `everything-rust --version`.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language being ported
      options:
        - TypeScript/JavaScript
        - Python
        - C
        - Go
        - Ruby
        - Java
        - PHP
        - C#
        - Not language specific
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `everything-rust doctor` (1.6+), or your OS, Node/Python/etc. versions. Check it for paths or names you'd rather not share.
      render: text
      placeholder: macOS 26 arm64, Node 22
    validations:
      required: true
