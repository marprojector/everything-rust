name: Ports on npm

# Builds the Prettier and ESLint front doors on every platform and packs them with
# `everything-rust package` into npm tarballs (uploaded as an artifact). Nothing is published.

on:
  workflow_dispatch:
  push:
    tags: ['ports-v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.port }} ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        port: [prettier, eslint]
        key: [darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu, win32-x64-msvc]
        include:
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { key: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { key: linux-x64-gnu, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { key: linux-arm64-gnu, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { key: win32-x64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the front door
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --manifest-path demo/real-world/${{ matrix.port }}-rs/app/Cargo.toml --target-dir target
          mkdir -p bin
          exe=target/${{ matrix.target }}/release/${{ matrix.port }}
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" bin/
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.port }}-${{ matrix.key }}
          path: bin/*
          if-no-files-found: error

  pack:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: built
      - name: Lay out and pack the packages
        shell: bash
        run: |
          mkdir -p tarballs
          for spec in prettier:prettier-rs:prettier-rs:prettier@3.6.2 eslint:eslint-rs:eslint-rs:eslint@10.15.0; do
            IFS=: read -r port name bin original <<< "$spec"
            out="out/$port"
            target/release/everything-rust package "demo/real-world/$port-rs/app" \
              --name "$name" --bin "$bin" --original "$original" --out "$out"
            for built in built/bin-"$port"-*; do
              key="${built##*/bin-"$port"-}"
              mkdir -p "$out/npm/$key/bin"
              cp "$built"/* "$out/npm/$key/bin/"
              chmod +x "$out/npm/$key/bin/"*
              npm pack "./$out/npm/$key" --pack-destination tarballs
            done
            npm pack "./$out" --pack-destination tarballs
          done
      - name: Install on Linux and compare with the originals
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/prefix"
          npm i -g --prefix "$prefix" ./tarballs/*-linux-x64-gnu-*.tgz ./tarballs/prettier-rs-3.6.2.tgz ./tarballs/eslint-rs-10.15.0.tgz
          test "$(file -b "$prefix/lib/node_modules/prettier-rs/bin/prettier" | cut -c1-3)" = ELF
          printf 'const a = {b:1,\n c:2}\n' > "$RUNNER_TEMP/x.ts"
          printf 'var x = 1; x == null\n' > "$RUNNER_TEMP/y.js"
          modules="$prefix/lib/node_modules"
          diff <("$prefix/bin/prettier-rs" --stdin-filepath x.ts < "$RUNNER_TEMP/x.ts") \
            <(node "$modules/prettier-rs/node_modules/prettier/bin/prettier.cjs" --stdin-filepath x.ts < "$RUNNER_TEMP/x.ts")
          rule='{"eqeqeq":"error"}'
          diff <("$prefix/bin/eslint-rs" --no-config-lookup --rule "$rule" --stdin < "$RUNNER_TEMP/y.js" || true) \
            <(node "$modules/eslint-rs/node_modules/eslint/bin/eslint.js" --no-config-lookup --rule "$rule" --stdin < "$RUNNER_TEMP/y.js" || true)
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: tarballs/*
          if-no-files-found: error
